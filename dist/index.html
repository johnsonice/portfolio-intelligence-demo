.card {

  corner-shape: var(--corner-shape);

  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;

.form-switch .form-check-input:checked {
  background: var(--primary);
}

  box-shadow: 0 0 0 2px var(--ring);

.form-range {

  height: 28px;

  padding: 0;

  height: 20px;

  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-control,

    font-size: max(16px, var(--font-size-normal));
  }

    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

/* Deterministic interaction mock. No model, network, or external data is used. */
function parsePortfolioRequest(text, current) {
  const result = { recognized: false, ops: [], notes: [], unsupported: [] };
  if (typeof text !== &#x27;string&#x27; || !text.trim()) return result;
  const input = text.trim().replace(/[’‘]/g, &quot;&#x27;&quot;);
  const allIds = [&#x27;northstar&#x27;, &#x27;harbor&#x27;, &#x27;cedar&#x27;];
  const companyPatterns = {
    northstar: /\bnorthstar(?:\s+services)?\b/ig,
    harbor: /\bharbor(?:\s+labs)?\b/ig,
    cedar: /\bcedar(?:\s+works)?\b/ig
  };
  let scope = Array.isArray(current &amp;&amp; current.companyIds) ? current.companyIds.filter(id =&gt; allIds.includes(id)) : allIds.slice();
  const addUnsupported = value =&gt; { if (!result.unsupported.includes(value)) result.unsupported.push(value); };
  const note = value =&gt; { if (!result.notes.includes(value)) result.notes.push(value); };
  const op = (type, value, extra) =&gt; result.ops.push(Object.assign({ type, value }, extra || {}));
  // Split at command boundaries, while retaining company lists such as &quot;Northstar and Harbor&quot;.
  const clauses = input
    .replace(/\b(?:and|then|also|but)\s+(?=(?:add|remove|exclude|except|include|use|show|make|create|generate|turn|convert|shorten|compare|only|keep|rename|set|switch|don&#x27;t|do not)\b)/ig, &#x27;;&#x27;)
    .replace(/(?:并且|然后|同时|但是|但|并)(?=(?:添加|加入|加上|删除|移除|去掉|排除|包含|纳入|使用|显示|生成|制作|改成|改为|缩短|只看|仅看|不要|别))/g, &#x27;;&#x27;)
    .replace(/\s+(?=(?:except|excluding)\s+(?:Northstar|Harbor|Cedar)\b)/ig, &#x27;;&#x27;)
    .split(/[;,\n，；。！？!?]+/).map(s =&gt; s.trim()).filter(Boolean);

  function negatedBefore(s, index) {
    const prefix = s.slice(0, index);
    return /(?:\b(?:do\s+not|don&#x27;t|never|avoid|no\s+need\s+to)\b(?:\s+[a-z-]+){0,5}\s*|(?:不要|别|不用|无需|不需要)[^，；。!?]{0,12})$/i.test(prefix);
  }
  function positiveMatch(s, regex) {
    const flags = regex.flags.includes(&#x27;g&#x27;) ? regex.flags : regex.flags + &#x27;g&#x27;;
    for (const match of s.matchAll(new RegExp(regex.source, flags))) {
      if (!negatedBefore(s, match.index)) return match;
    }
    return null;
  }
  function omittedMetric(s, index) {
    const prefix = s.slice(0, index);
    return negatedBefore(s, index) || /(?:\b(?:without|exclude|excluding|omit|remove|no)\b(?:\s+[a-z-]+){0,3}\s*|(?:排除|去掉|移除|不包含|不包括)[^，；。]{0,8})$/i.test(prefix);
  }

  for (const clause of clauses) {
    const s = clause.toLowerCase();
    // A title is literal user content, not a second source of commands or filters.
    const titleMatch = clause.match(/(?:\b(?:rename|retitle)(?:\s+(?:it|this|the\s+report))?(?:\s+to)?|\b(?:set|change)\s+(?:the\s+)?title\s+to|(?:标题改为|标题改成|重命名为|命名为))\s*[:：]?\s*[&quot;“]?(.+?)[&quot;”]?$/i);
    if (titleMatch) {
      if (!negatedBefore(clause, titleMatch.index)) {
        const title = titleMatch[1].replace(/^[&quot;“]|[&quot;”]$/g, &#x27;&#x27;).trim();
        if (title) op(&#x27;title&#x27;, title.slice(0, 120));
      }
      continue;
    }
    const mentionedIds = allIds.filter(id =&gt; { companyPatterns[id].lastIndex = 0; return companyPatterns[id].test(clause); });

    // Clearly requested unavailable entities never silently map to the sample companies.
    const missingKnown = clause.match(/\b(?:red\s+nucleus|bazaarvoice|ya\s+group|acme)\b/ig);
    if (missingKnown) missingKnown.forEach(name =&gt; addUnsupported(&#x27;Company “&#x27; + name + &#x27;” is not in this mock. Available companies: Northstar Services, Harbor Labs, and Cedar Works.&#x27;));
    const namedCompany = clause.match(/(?:\b(?:company|companies)\s+(?:named\s+)?[&quot;“]?([A-Z][\w-]*(?:\s+[A-Z][\w-]*){0,2})|(?:公司[：:\s]*[&quot;“]?)([A-Za-z][\w-]*(?:\s+[A-Z][\w-]*){0,2}))/);
    if (namedCompany) {
      const name = namedCompany[1] || namedCompany[2];
      if (!allIds.some(id =&gt; name.toLowerCase().includes(id)) &amp;&amp; !/^(all|report|comparison|data|cost|revenue|september|august)$/i.test(name) &amp;&amp; !missingKnown) {
        addUnsupported(&#x27;Company “&#x27; + name + &#x27;” is not in this mock. Available companies: Northstar Services, Harbor Labs, and Cedar Works.&#x27;);
      }
    }
    const unavailableMetrics = [
      [/\b(?:headcount|fte|employee\s+count|number\s+of\s+employees|per\s+(?:employee|person|fte)|revenue\s+per\s+head)\b|员工人数|员工数量|人头数|人数|编制|人均|人效/ig, &#x27;Employee counts / FTE are unavailable; this mock has aggregate personnel cost and revenue only, so per-employee metrics cannot be calculated.&#x27;],
      [/\b(?:salar(?:y|ies)|compensation|payroll|pay\s+band|individual\s+pay)\b|工资|薪水|薪资|薪酬|个人薪/ig, &#x27;Employee salary and compensation records are unavailable; aggregate personnel cost cannot establish individual pay.&#x27;],
      [/\b(?:attrition|turnover|retention|hiring|hires|departures|tenure|diversity|gender|age|promotion|performance\s+rating)\b|离职|流失|留存|招聘|入职|任期|性别|年龄|晋升|绩效/ig, &#x27;Employee movement and demographic data are unavailable; this mock cannot calculate attrition, hiring, or employee-level metrics.&#x27;],
      [/\b(?:ebitda|profit|margin|cash\s*flow|balance\s*sheet|equity|stock\s+option|valuation|forecast|predict)\b|利润|毛利|现金流|资产负债|股权|估值|预测/ig, &#x27;This mock contains historical revenue and personnel cost only; profit, cash flow, equity, valuation, and forecasts are unavailable.&#x27;],
      [/\b(?:engineering|sales|marketing|finance|legal|operations|product)\s+(?:department|team|costs?)\b|(?:工程|销售|市场|财务|法务|运营|产品)(?:部门|团队|成本)/ig, &#x27;Department data is limited to Customer Support and Other. Individual departments inside Other are unavailable.&#x27;],
      [/\b(?:org(?:anization(?:al)?)?\s+(?:chart|structure)|span\s+of\s+control|management\s+layers?|reporting\s+lines?)\b|组织架构|组织层级|管理幅度|管理层级|汇报关系/ig, &#x27;Organization hierarchy and reporting relationships are unavailable; this mock cannot build an org chart or calculate management span.&#x27;]
    ];
    for (const [pattern, message] of unavailableMetrics) {
      for (const match of clause.matchAll(pattern)) {
        if (!omittedMetric(clause, match.index)) { addUnsupported(message); break; }
      }
    }
    if (positiveMatch(clause, /\b(?:why|root\s+cause|caus(?:e|ed|ation)|prove|explain\s+the\s+reason)\b|为什么|为何|根因|原因|因果|证明/i)) {
      addUnsupported(&#x27;Causal explanations require business context and supporting evidence. This mock can compare observed cost and revenue changes, but cannot determine why they occurred.&#x27;);
    }
    if (positiveMatch(clause, /\b(?:send|email|slack|publish|schedule|automate|connect|upload|download\s+(?:a\s+)?(?:pdf|ppt|excel)|export\s+(?:to\s+)?(?:pdf|ppt|excel))\b|发送|发邮件|发布|定时|自动运行|连接|上传|导出(?:PDF|PPT|Excel|文件)/i)) {
      addUnsupported(&#x27;External actions, connectors, scheduled runs, and file exports are not connected in this interaction mock.&#x27;);
    }
    if (positiveMatch(clause, /\b(?:january|february|march|april|may|october|november|december|jan|feb|mar|apr|oct|nov|dec)\b|(?:1[012]|[1-5])月/i) || [...clause.matchAll(/\b20\d{2}\b/g)].some(m =&gt; m[0] !== &#x27;2026&#x27;)) {
      addUnsupported(&#x27;Sample data is available only from June through September 2026. The workspace supports June–August and June–September comparison windows.&#x27;);
    }
    if (positiveMatch(clause, /\b(?:daily|weekly|quarterly|yearly|year.over.year|yoy)\b|每日|每天|每周|按周|季度|年度|同比/i)) {
      addUnsupported(&#x27;Only monthly sample data from June–September 2026 is available; daily, weekly, quarterly, and year-over-year views cannot be generated.&#x27;);
    }
    if (positiveMatch(clause, /\b(?:only|just|solely)\s+(?:in\s+)?(?:june|july|august|september|jun|jul|aug|sep|sept)\b|(?:只看|仅看|仅限|只要|只有)(?:六月|七月|八月|九月|[6-9]月)/i)) {
      addUnsupported(&#x27;Single-month filtering is not implemented in this mock. Supported windows are June–August and June–September 2026.&#x27;);
    }

    const scopeAll = positiveMatch(clause, /\b(?:all\s+(?:the\s+)?companies|entire\s+portfolio|whole\s+portfolio|portfolio.wide|all\s+three(?:\s+companies)?|both\s+companies)\b|所有公司|全部公司|三家公司|整个(?:投资)?组合/i);
    if (scopeAll &amp;&amp; !/\b(?:remove|exclude|omit)\s+all\b|移除所有|排除所有/.test(s)) { scope = allIds.slice(); op(&#x27;scope&#x27;, scope.slice()); }
    const companyAction = clause.match(/\b(?:add|include|bring\s+in|remove|exclude|except|excluding|drop|omit|without|only|just|compare|focus\s+on|switch\s+to)\b|加入|加上|添加|包含|纳入|移除|去掉|排除|删除|只看|仅看|只要|对比|比较|切换到|聚焦/ig);
    if (mentionedIds.length) {
      const action = companyAction &amp;&amp; companyAction[0];
      const actionIndex = action ? clause.toLowerCase().indexOf(action.toLowerCase()) : Math.min(...mentionedIds.map(id =&gt; s.indexOf(id)));
      if (!negatedBefore(clause, actionIndex)) {
        if (action &amp;&amp; /^(?:remove|exclude|except|excluding|drop|omit|without|移除|去掉|排除|删除)$/i.test(action)) {
          const next = scope.filter(id =&gt; !mentionedIds.includes(id));
          if (next.length) { scope = next; op(&#x27;scope&#x27;, scope.slice()); }
          else addUnsupported(&#x27;At least one sample company must remain in the workspace.&#x27;);
        } else if (action &amp;&amp; /^(?:add|include|bring\s+in|加入|加上|添加|包含|纳入)$/i.test(action)) {
          scope = allIds.filter(id =&gt; scope.includes(id) || mentionedIds.includes(id)); op(&#x27;scope&#x27;, scope.slice());
        } else if (!scopeAll) { scope = mentionedIds.slice(); op(&#x27;scope&#x27;, scope.slice()); }
      }
    }

    const support = /\b(?:customer\s+support|support)\b|客户支持|客服|支持部门/.test(s);
    if (support) {
      const exclude = positiveMatch(clause, /\b(?:exclude|excluding|remove|without|omit|except)\b|排除|去掉|移除|不包含|不包括/i);
      const dontInclude = clause.match(/\b(?:do\s+not|don&#x27;t)\s+(?:include|show)\b|不要(?:包含|显示)|不(?:包含|显示)/i);
      const only = positiveMatch(clause, /\b(?:only|just|solely|focus\s+on)\b|只看|仅看|仅限|只要|只有|聚焦/i);
      const include = positiveMatch(clause, /\b(?:include|including|restore|add\s+back)\b|包含|包括|恢复|加回/i);
      if (exclude || dontInclude) op(&#x27;basis&#x27;, &#x27;other&#x27;);
      else if (only) op(&#x27;basis&#x27;, &#x27;support&#x27;);

 function chart(a){const figure=a.chart===&#x27;table&#x27;?growthTable(a):a.chart===&#x27;line&#x27;?`&lt;div class=&quot;as-chart-legend&quot;&gt;&lt;span&gt;&lt;b class=&quot;as-swatch&quot;&gt;&lt;/b&gt;${metric(a)}&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;as-swatch blue&quot;&gt;&lt;/b&gt;Revenue&lt;/span&gt;&lt;/div&gt;&lt;svg class=&quot;as-linechart&quot; role=&quot;img&quot; aria-label=&quot;Monthly indexed cost and revenue trend, June equals 100&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;as-chart-note&quot;&gt;&lt;span&gt;Selected companies combined · June = 100&lt;/span&gt;&lt;span&gt;Monthly index&lt;/span&gt;&lt;/div&gt;`:barChart(a);return block(&#x27;chart&#x27;,a,`&lt;div class=&quot;ws-chart-frame&quot;&gt;${figure}&lt;/div&gt;${a.length!==&#x27;short&#x27;?reportScorecard(a):&#x27;&#x27;}`);}
 function breakdown(a){const c=reportFacts(a),totalDelta=a.companyIds.reduce((n,id)=&gt;n+data[id].cost[c.e]-data[id].cost[0],0),other=totalDelta-c.support,share=totalDelta&gt;0?c.support/totalDelta*100:0;return block(&#x27;breakdown&#x27;,a,`&lt;div class=&quot;ws-driver-intro&quot;&gt;&lt;div&gt;&lt;span&gt;Change in monthly people cost&lt;/span&gt;&lt;strong&gt;${money(totalDelta)}&lt;/strong&gt;&lt;p&gt;June → ${endName(a)}&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Customer Support contribution&lt;/span&gt;&lt;strong&gt;${share.toFixed(1)}%&lt;/strong&gt;&lt;p&gt;${money(c.support)} Support · ${money(other)} Other&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${a.basis!==&#x27;total&#x27;?`&lt;p class=&quot;ws-basis-note&quot;&gt;Full people-cost context below. The report’s selected basis remains ${esc(metric(a).toLowerCase())}; it is not changed by this breakdown.&lt;/p&gt;`:&#x27;&#x27;}&lt;div class=&quot;as-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Company&lt;/th&gt;&lt;th&gt;Support change&lt;/th&gt;&lt;th&gt;Other change&lt;/th&gt;&lt;th&gt;Contribution to increase&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${a.companyIds.map(id=&gt;{const d=data[id],s=d.support[c.e]-d.support[0],t=d.cost[c.e]-d.cost[0],o=t-s,sh=t&gt;0?s/t*100:0;return `&lt;tr&gt;&lt;td&gt;${names[id]}&lt;/td&gt;&lt;td&gt;${money(s)}&lt;/td&gt;&lt;td&gt;${money(o)}&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;ws-contribution&quot; role=&quot;img&quot; aria-label=&quot;Customer Support ${sh.toFixed(1)} percent of ${names[id]} total cost increase&quot;&gt;&lt;span style=&quot;width:${Math.min(100,Math.max(0,sh))}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;small&gt;${sh.toFixed(1)}% Support&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ws-driver-reading&quot;&gt;&lt;strong&gt;Interpretation to validate&lt;/strong&gt;&lt;p&gt;Concentration in Support makes service demand, staffing plans and role mix useful areas t  function questions(a){const c=reportFacts(a);return block(&#x27;questions&#x27;,a,`&lt;div class=&quot;ws-review-lead&quot;&gt;&lt;p&gt;Use these findings to structure the next operating review. Evidence requests below are proposed follow-ups, not completed actions.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ws-review-agenda&quot;&gt;${c.ranked.map((r,i)=&gt;{const pressure=r.cg&gt;r.rg,share=(data[r.id].support[c.e]-data[r.id].support[0])/(data[r.id].cost[c.e]-data[r.id].cost[0])*100;return `&lt;article&gt;&lt;span class=&quot;ws-agenda-number&quot;&gt;0${i+1}&lt;/span&gt;&lt;div&gt;&lt;h4&gt;${r.name}&lt;span class=&quot;ws-gap ${pressure?&#x27;pressure&#x27;:&#x27;improving&#x27;}&quot;&gt;${pressure?&#x27;Explain cost growth&#x27;:&#x27;Validate revenue momentum&#x27;}&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;${metric(a)} ${p(r.cg)} vs. revenue ${p(r.rg)}; cost / revenue ${(r.cost/r.revenue*100).toFixed(1)}%.&lt;/p&gt;&lt;div class=&quot;ws-agenda-ask&quot;&gt;&lt;strong&gt;Ask for&lt;/strong&gt;&lt;span&gt;${pressure?(a.basis===&#x27;total&#x27;?`The approved staffing plan, Support service volumes and any temporary project costs. Support explains ${share.toFixed(1)}% of this company’s total cost increase.`:&#x27;A department-level reconciliation and operating context for the selected cost basis.&#x27;): &#x27;Revenue by customer or service line, recurring versus one-off revenue, and any timing effects.&#x27;}&lt;/span&gt;&lt;/div&gt;${a.length!==&#x27;short&#x27;?`&lt;div class=&quot;ws-agenda-ask&quot;&gt;&lt;strong&gt;Next check&lt;/strong&gt;&lt;span&gt;${pressure?&#x27;Compare the next publication with the plan and reassess the growth gap and cost-to-revenue ratio.&#x27;:&#x27;Check whether revenue momentum persists without a matching acceleration in the selected cost base.&#x27;}&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/article&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;details class=&quot;ws-methodology&quot;&gt;&lt;summary&gt;${I(&#x27;file-search&#x  function caseAgenda(id){return {northstar:[[&#x27;Is the Support ramp tied to a planned launch?&#x27;,&#x27;Monthly hiring plan, start dates and customer go-live schedule.&#x27;,&#x27;Match the timing of the Support increase with planned capacity additions and revenue activation.&#x27;],[&#x27;Did service demand grow with the cost base?&#x27;,&#x27;Monthly ticket volumes, resolution times and service-level performance.&#x27;,&#x27;Compare cost per resolved ticket and service quality before and after the ramp.&#x27;],[&#x27;Is the August cost level recurring?&#x27;,&#x27;Payroll bridge separating base pay, overtime, contractors and one-off items.&#x27;,&#x27;Separate recurring run rate from temporary spend before considering any intervention.&#x27;]],cedar:[[&#x27;What changed in Support during August?&#x27;,&#x27;Support payroll bridge, contractor invoices and service volumes.&#x27;,&#x27;Explain the $60k July-to-August Support increase before extrapolating the trend.&#x27;],[&#x27;Is the rest of the cost increase planned?&#x27;,&#x27;Department-level actuals against the approved operating plan.&#x27;,&#x27;Allocate the $70k increase outside Support and identify recurring versus temporary items.&#x27;],[&#x27;Is revenue recognition lagging delivery?&#x27;,&#x27;Customer go-live dates, billings and revenue-recognition schedule.&#x27;,&#x27;Check whether the cost/revenue timing gap reflects delivery lead time or sustained pressure.&#x27;]],harbor:[[&#x27;Is revenue growth broad-based?&#x27;,&#x27;Revenue bridge by customer, product and recurring versus one-time work.&#x27;,&#x27;Check concentration and repeatability before treating the ratio improvement as structural.&#x27;],[&#x27;Can the current capacity sustain growth?&#x27;,&#x27;Service volumes, capacity utilization and service-level trends.&#x27;,&#x27;Test whether demand is scaling within capacity or creating a hiring backlog.&#x27;],[&#x27;Which practices might transfer to other companies?&#x27;,&#x27;Deliver  function casePage(){const id=state.selectedCase,d=caseDefs[id],v=data[id],cfg=caseConfig(id),r=calc(cfg),delta=v.cost[2]-v.cost[0],support=v.support[2]-v.support[0],other=delta-support,share=support/delta*100,ratio=v.cost[2]/v.revenue[2]*100,ratio0=v.cost[0]/v.revenue[0]*100,gap=r.cg-r.rg,peers=calc({...cfg,companyIds:Object.keys(data)}).rows,options=caseResearchOptions(id);const interpretation=id===&#x27;harbor&#x27;?&#x27;Revenue has grown with a smaller increase in people cost. The improving cost ratio is an encouraging operating signal; customer mix and capacity data are needed to assess repeatability.&#x27;:`People cost is absorbing a larger share of revenue. Customer Support accounts for ${share.toFixed(1)}% of the dollar increase, making it the first area to review. The figures alone do not establish overstaffing or an unplanned cost overrun.`;return `&lt;section class=&quot;hub-case-page cr-page&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;hub-back&quot; data-route=&quot;cases&quot;&gt;${I(&#x27;arrow-left&#x27;)}Back to cases&lt;/button&gt;&lt;header class=&quot;cr-header&quot;&gt;&lt;div class=&quot;as-kicker&quot;&gt;Operating review / Case ${d.no}&lt;/div&gt;&lt;div class=&quot;cr-title-row&quot;&gt;&lt;h1&gt;${d.title}&lt;/h1&gt;&lt;button type=&quot;button&quot; class=&quot;as-button&quot; data-aa-case=&quot;${id}&quot;&gt;${I(&#x27;sparkles&#x27;)}Explain this change&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;cr-meta&quot;&gt;&lt;span class=&quot;cr-company&quot;&gt;${I(&#x27;building-2&#x27;)}${names[id]}&lt;/span&gt;&lt;span&gt;June–August 2026&lt;/span&gt;&lt;span class=&quot;hub-pill ${id===&#x27;harbor&#x27;?&#x27;&#x27;:&#x27;amber&#x27;}&quot;&gt;${d.type}&lt;/span&gt;&lt;span&gt;Prepared from 3 monthly publications&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;&lt;article class=&quot;cr-paper&quot;&gt;&lt;section class=&quot;cr-summary&quot;&gt;&lt;div class=&quot;cr-section-label&quot;&gt;01 / Executive assessment&lt;/div&gt;&lt;h2&gt       getContent(trigger).length === 0 ||

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

    }

    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

<script>
(()=>{const frame=document.querySelector('iframe'),key='pe-workspace-layout-v1';
function clean(p){if(!p||typeof p!=='object')return null;const o={};for(const k of ['navWidth','tasksWidth','chatWidth'])if(Number.isFinite(p[k]))o[k]=Math.max(0,Math.min(1800,p[k]));for(const k of ['navCollapsed','tasksCollapsed'])if(typeof p[k]==='boolean')o[k]=p[k];if(['split','chat','artifacts'].includes(p.mode))o.mode=p.mode;return o;}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='pe-layout-load'){let layout=null;try{layout=clean(JSON.parse(localStorage.getItem(key)))}catch{}frame.contentWindow.postMessage({type:'pe-layout-loaded',layout},'*');}else if(e.data?.type==='pe-layout-save'){const p=clean(e.data.layout);if(p)try{localStorage.setItem(key,JSON.stringify(p))}catch{}}});})();
</script>
